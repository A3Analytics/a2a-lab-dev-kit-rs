[package]
name = "a2a-lab-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Rust SDK for lab logs, metrics, and workflows over A2A and MCP"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
type_complexity = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[features]
default = ["aas", "opcua", "sila2"]
aas = []
opcua = ["dep:async-opcua-client", "dep:async-opcua-types"]
sila2 = [
    "dep:tonic",
    "dep:prost",
    "dep:tonic-prost",
    "dep:mdns-sd",
    "dep:rcgen",
    "dep:tonic-prost-build",
    "dep:protoc-bin-vendored",
]

[build-dependencies]
protoc-bin-vendored = { version = "3.2.0", optional = true }
tonic-prost-build = { version = "0.14.6", optional = true }

[dependencies]
async-opcua-client = { version = "0.19.0", optional = true }
async-opcua-types = { version = "0.19.0", optional = true }
axum = "0.8.9"
futures-util = "0.3.34"
jiff = { version = "0.2.37", features = ["serde"] }
mdns-sd = { version = "0.21.4", optional = true }
prost = { version = "0.14.4", optional = true }
rcgen = { version = "0.14.10", optional = true }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "client"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std"] }
tonic = { version = "0.14.6", optional = true, features = ["tls-ring"] }
tonic-prost = { version = "0.14.6", optional = true }

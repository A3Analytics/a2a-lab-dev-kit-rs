name: SiLA 2 consumer interop

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sila2-consumer-interop
  cancel-in-progress: true

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: SiLA 2 Feature Consumer interop
        run: bash .mise/scripts/sila2-consumer-interop.sh

name: Wiki

on:
  push:
    branches: [main]
    paths:
      - backlog/docs/**
      - .mise/wiki-map.toml
      - .mise/scripts/wiki-*.sh
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require WIKI_TOKEN
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::Add repository secret WIKI_TOKEN (fine-grained PAT, Wikis: Read and write). GITHUB_TOKEN cannot publish the Wiki."
            exit 1
          fi

      - name: Publish Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: bash .mise/scripts/wiki-publish.sh

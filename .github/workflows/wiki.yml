name: Wiki

on:
  pull_request:
    paths:
      - backlog/docs/**
      - README.md
      - .mise/wiki-map.toml
      - .mise/scripts/wiki-*.sh
      - .github/workflows/wiki.yml
  push:
    branches: [main]
    paths:
      - backlog/docs/**
      - README.md
      - .mise/wiki-map.toml
      - .mise/scripts/wiki-*.sh
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Wiki
        run: bash .mise/scripts/wiki-check.sh

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require WIKI_TOKEN
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::Add repository secret WIKI_TOKEN (fine-grained PAT, Wikis: Read and write). GITHUB_TOKEN cannot publish the Wiki."
            exit 1
          fi

      - name: Publish Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: bash .mise/scripts/wiki-publish.sh

      - name: Confirm remote Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: bash .mise/scripts/wiki-drift.sh

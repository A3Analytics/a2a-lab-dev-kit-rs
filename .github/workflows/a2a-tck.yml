name: A2A TCK

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: a2a-tck
  cancel-in-progress: true

jobs:
  tck:
    runs-on: ubuntu-latest
    env:
      MISE_AUTO_INSTALL: "0"
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v2
        with:
          install_args: rust

      - name: Official A2A TCK
        run: bash .mise/scripts/a2a-tck.sh

      - name: Show TCK report
        if: always()
        run: bash .mise/scripts/a2a-tck-summary.sh

      - name: Publish TCK reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-tck-reports
          path: target/a2a-tck-reports/
          if-no-files-found: ignore
          retention-days: 14

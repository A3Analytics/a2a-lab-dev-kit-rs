name: A2A-LAB Compliance (deprecated bridge)
description: Deprecated compatibility bridge to the standalone A2A-LAB TCK.
author: A3Analytics

branding:
  icon: check-circle
  color: green

inputs:
  a2a-url:
    description: Absolute HTTP(S) URL of the deterministic A2A endpoint
    required: true
  mcp-url:
    description: Absolute HTTP(S) URL of the deterministic MCP Streamable HTTP endpoint
    required: true
  fixtures:
    description: Path to the JSON fixture declaration in the consumer checkout
    required: true
  profile:
    description: A2A-LAB compliance profile version
    required: false
    default: "1.1.0"
  suite:
    description: Compliance scope to run (basic or full)
    required: false
    default: full
  llm-check:
    description: Whether full-suite A2A agent-message checks are enabled (true or false)
    required: false
    default: "true"
  report-path:
    description: Path where the machine-readable JSON report is retained
    required: false
    default: "a2a-lab-compliance.json"
  timeout-milliseconds:
    description: Maximum duration of each interface call in milliseconds
    required: false
    default: "30000"
  implementation-name:
    description: Implementation name recorded in the report
    required: false
    default: ${{ github.repository }}
  implementation-version:
    description: Implementation revision recorded in the report
    required: false
    default: ${{ github.sha }}

outputs:
  profile:
    description: Selected A2A-LAB compliance profile version
    value: ${{ steps.compliance.outputs.profile }}
  suite:
    description: Selected basic or full compliance suite
    value: ${{ steps.compliance.outputs.suite }}
  llm-check:
    description: Whether the full-suite A2A agent-message check was selected
    value: ${{ steps.compliance.outputs.llm-check }}
  compliant:
    description: Whether every required case in the selected profile passed
    value: ${{ steps.compliance.outputs.compliant }}
  report-path:
    description: Path to the retained machine-readable JSON report
    value: ${{ steps.compliance.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Announce standalone A2A-LAB TCK migration
      shell: bash
      run: |
        echo "::warning title=A2A-LAB Action moved::This devkit Action is deprecated. Migrate to A3Analytics/a2a-lab-tck@1fd47d5c73e6fa3f7bd6505d75e43ee68cae33fd."
    - id: compliance
      name: Run standalone A2A-LAB TCK
      uses: A3Analytics/a2a-lab-tck@1fd47d5c73e6fa3f7bd6505d75e43ee68cae33fd
      with:
        a2a-url: ${{ inputs.a2a-url }}
        mcp-url: ${{ inputs.mcp-url }}
        fixtures: ${{ inputs.fixtures }}
        profile: ${{ inputs.profile }}
        suite: ${{ inputs.suite }}
        llm-check: ${{ inputs.llm-check }}
        report-path: ${{ inputs.report-path }}
        timeout-milliseconds: ${{ inputs.timeout-milliseconds }}
        implementation-name: ${{ inputs.implementation-name }}
        implementation-version: ${{ inputs.implementation-version }}

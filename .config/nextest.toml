[test-groups]
browser = { max-threads = 1 }

[profile.default]
failure-output = "immediate-final"
fail-fast = false

[[profile.default.overrides]]
filter = 'binary(web_ui_agent) | binary(web_ui_browser) | binary(web_ui_chat) | binary(web_ui_chrome) | binary(web_ui_images) | binary(web_ui_images_closeout) | binary(web_ui_images_visual) | binary(web_ui_loading) | binary(web_ui_logs) | binary(web_ui_metrics) | binary(web_ui_parity) | binary(web_ui_tasks_ui) | binary(web_ui_visual)'
test-group = 'browser'

[profile.ci]
junit.path = "junit.xml"
failure-output = "immediate-final"
fail-fast = false

[[profile.ci.overrides]]
filter = 'binary(web_ui_agent) | binary(web_ui_browser) | binary(web_ui_chat) | binary(web_ui_chrome) | binary(web_ui_images) | binary(web_ui_images_closeout) | binary(web_ui_images_visual) | binary(web_ui_loading) | binary(web_ui_logs) | binary(web_ui_metrics) | binary(web_ui_parity) | binary(web_ui_tasks_ui) | binary(web_ui_visual)'
test-group = 'browser'

[profile.measure]
retries = 0
fail-fast = false
failure-output = "immediate-final"

[profile.measure.junit]
path = "junit.xml"

[profile.fast]
retries = 0
fail-fast = false
failure-output = "immediate-final"

[test-groups]
browser = { max-threads = 1 }
local-http = { max-threads = 2 }

[profile.default]
failure-output = "immediate-final"
fail-fast = false

[[profile.default.overrides]]
filter = 'binary(web_browser)'
test-group = 'browser'
retries = 1

[[profile.default.overrides]]
filter = 'binary(local_http)'
test-group = 'local-http'
retries = 1

[profile.ci]
junit.path = "junit.xml"
failure-output = "immediate-final"
fail-fast = false

[[profile.ci.overrides]]
filter = 'binary(web_browser)'
test-group = 'browser'
retries = 1

[[profile.ci.overrides]]
filter = 'binary(local_http)'
test-group = 'local-http'
retries = 1

[profile.measure]
retries = 0
fail-fast = false
failure-output = "immediate-final"

[profile.measure.junit]
path = "target/nextest-measure.xml"

[[profile.measure.overrides]]
filter = 'binary(web_browser)'
test-group = 'browser'

[[profile.measure.overrides]]
filter = 'binary(local_http)'
test-group = 'local-http'

[profile.fast]
retries = 0
fail-fast = false
failure-output = "immediate-final"

[[profile.fast.overrides]]
filter = 'binary(web_browser)'
test-group = 'browser'
retries = 0

[[profile.fast.overrides]]
filter = 'binary(local_http)'
test-group = 'local-http'
retries = 0

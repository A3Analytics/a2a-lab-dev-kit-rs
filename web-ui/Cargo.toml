[package]
name = "a2a-lab-web-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "Browser shell compiled to WebAssembly and served by a2a-lab-dev-kit"

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"

[dependencies]
js-sys = "=0.3.106"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
dioxus = "=0.7.10"
dioxus-web = "=0.7.10"
dioxus-charts = "=0.4.0"
web-sys = { version = "=0.3.106", features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "HtmlElement",
    "HtmlImageElement",
    "KeyboardEvent",
    "MediaQueryList",
    "Navigator",
    "NodeList",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Location",
    "Node",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "Window",
] }

[patch.crates-io]
dioxus-charts = { path = "patches/dioxus-charts" }
